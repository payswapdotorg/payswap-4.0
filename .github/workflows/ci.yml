# PaySwap 4.0 — PR/push 验证门禁（P1 架构师治理建议：本地测试结论必须有可独立复现的 CI 证据）。
#
# 范围与本地 verify:pre-push 的关系（诚实边界，见 PR 说明）：
# - CI 覆盖本 PR 声明的全部可复现门禁：install + 构建 + lint + typecheck（root 与
#   zcode-cli）+ architecture:check + payswap 插件包测试 + bootstrap 插件系统受影响
#   测试（plugins / plugins-protocol / bundled-plugins-resilience / payswap-launch-path /
#   payswap-host-launch —— 后者经真实构建的 zcode.cjs 入口 + __zcode-plugin-host 派发
#   执行完整生产启动命令，见架构师评审第 2 轮第 3 项的收口）。
# - 全量套件（engineering 158 文件、bootstrap 全量）仍是本地 verify:pre-push 门禁；
#   其 2 个已知沙盒环境性失败（session-persistence 的 5s 超时，4GB/2vCPU 内存压力）
#   已在未修改基线上对照复现，与本仓库改动无关，不属于 CI 断言范围。
# - e2e-remote targets 与 desktop 运行时资产构建依赖本机/远程环境，不入 CI。
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 与本地通过验证相同的堆上限；2 vCPU runner 上并行 tsc 需要约束。
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 读取根 package.json 的 packageManager（pnpm@10.33.2）

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build workspace (root packages + zcode-cli, desktop runtime assets excluded)
        run: pnpm -r --workspace-concurrency=2 --filter '!@zcode/desktop' run build

      - name: Lint (0 errors gate)
        run: pnpm lint

      - name: Typecheck (root projects)
        run: pnpm typecheck

      # turbo 的 bin 只在仓库根 node_modules/.bin（apps/zcode-cli 声明了 devDep 但 pnpm 只装在根），
      # 因此从根 exec，用 turbo 自己的 --cwd 指向 zcode-cli 工作区。
      - name: Typecheck (zcode-cli workspace, serial)
        run: pnpm exec turbo run typecheck --concurrency=1 --cwd apps/zcode-cli

      - name: Architecture check (0 violations gate)
        run: node scripts/architecture/architecture-check.mjs check

      - name: Payswap plugin package tests
        run: pnpm --filter @zcode/payswap-plugin run test

      # vitest 未列在 bootstrap 自己的 devDeps（靠 workspace 根提升），--filter exec 才能解析到 bin。
      # payswap-host-launch 依赖上方 "Build workspace" 步骤产出的 cli/dist/zcode.cjs
      # （@zcode/cli 也在 pnpm -r build 范围内）；无需额外构建步骤。
      - name: Bootstrap plugin-system tests (this change's affected scopes)
        run: >
          pnpm --filter @zcode/bootstrap exec vitest run
          tests/plugins.test.ts
          tests/plugins-protocol.test.ts
          tests/bundled-plugins-resilience.test.ts
          tests/payswap-launch-path.test.ts
          tests/payswap-host-launch.test.ts
          tests/payswap-broker-credentials.test.ts
          tests/payswap-broker-peer-verification.test.ts
          tests/payswap-broker-peer-relay.test.ts
          tests/payswap-broker-peer-relay-windows.test.ts
          tests/payswap-broker-dispatch.test.ts
          tests/payswap-broker-spawn-wiring.test.ts
          tests/payswap-broker-session-scope.test.ts
          tests/payswap-broker-replay.test.ts
          tests/payswap-broker-bridge-client.test.ts
          tests/payswap-broker-chain.test.ts
          tests/payswap-operator-law.test.ts
          tests/payswap-grant-law.test.ts
          tests/payswap-hook-admission.test.ts
          tests/payswap-browser-admission.test.ts
          tests/payswap-surface-lifecycle.test.ts
          tests/payswap-approval-desktop.test.ts

      # PaySwap P1.6：server 侧 operator-principal 生产边界套件（真实 createHttpServer +
      # 真实 HTTP/WS 升级握手 + 0600 原子持久化；packages/server/vitest.config.ts 装配
      # 包内入口 —— 根配置的 projects 相对路径从包目录启动会错位）。
      - name: Payswap server operator-auth tests (production boundary)
        run: pnpm --filter @zcode/server exec vitest run test/payswap-operator-auth.test.ts

      # PaySwap P1.7：server 侧批准边界生产套件（真实 /ws channel + 两级握手 +
      # N28/N29/N30/N31/N41 批准路径臂 + §1.6.2 item 5c 暴露策略）。
      - name: Payswap server approval tests (production boundary)
        run: pnpm --filter @zcode/server exec vitest run test/payswap-approval.test.ts

  # PaySwap P1.3 macOS 臂（ADR-13 D13.10）：平台行只在 darwin 证明 —— 真实
  # getpeereid/LOCAL_PEERPID、端点落位模式、父死亡清理、跨 uid EACCES（mock 不转绿，
  # playbook §5(5)）。诚实边界：本 job 只承载平台行所需范围（helper 编译 + relay 协议
  # 纪律套件 + macOS 平台套件 + peer-verification 的跨平台 fail-closed 行）；全量门禁
  # 仍在 ubuntu 的 gates job —— 两 job 互补，不是重复。
  gates-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 读取根 package.json 的 packageManager（pnpm@10.33.2）

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build workspace (root packages + zcode-cli, desktop runtime assets excluded)
        run: pnpm -r --workspace-concurrency=2 --filter '!@zcode/desktop' run build

      # ADR-13 D13.1/D13.4：hash 验证的供给面 —— CI 编译后把路径 + SHA-256 写入环境，
      # 套件经 PAYSWAP_BROKER_HELPER_{PATH,SHA256} 解析（D13.9；两键 host-only，
      # runtimeEnv 双表剔除保证不进任何子进程 env）。
      - name: Compile the macOS peer-verification helper (clang, warnings are errors)
        run: |
          set -eu
          cd apps/zcode-cli/native/payswap-broker-peer-macos
          cc -O2 -Wall -Wextra -Werror -o payswap-broker-peer-helper helper.c
          echo "PAYSWAP_BROKER_HELPER_PATH=$PWD/payswap-broker-peer-helper" >> "$GITHUB_ENV"
          echo "PAYSWAP_BROKER_HELPER_SHA256=$(shasum -a 256 payswap-broker-peer-helper | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Bootstrap payswap relay + macOS platform suites
        run: >
          pnpm --filter @zcode/bootstrap exec vitest run
          tests/payswap-broker-peer-verification.test.ts
          tests/payswap-broker-peer-relay.test.ts
          tests/payswap-broker-peer-relay-windows.test.ts
          tests/payswap-broker-peer-macos.test.ts


  # PaySwap P1.3 Windows 臂（ADR-14 D14.10；ADR-15 D15.7 平台行载体）：平台行只在
  # win32 证明 —— 真实 C# helper 经 prepare 脚本（ADR-15 的单一 CLI 持有编译纪律：
  # OS 内置 csc.exe；先例族 windows-browser-import-helper 同款；警告即错误，对应
  # gates-macos 的 clang -Werror）staging 出真实产物、真实 DACL SDDL 回读、
  # GetNamedPipeClientProcessId + 映像路径门、父死亡清理、单实例 busy（mock 不转绿，
  # playbook §5(5)）。诚实边界：本 job 只承载平台行所需范围（bootstrap 及其工作区
  # 依赖的构建 + peer-verification 的 win32 fail-closed 行 + Windows 平台套件）；
  # 宿主半边纪律由 ubuntu 的 gates job 钉住（POSIX 测试缝）—— 两 job 互补，不是重复。
  gates-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 读取根 package.json 的 packageManager（pnpm@10.33.2）

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build bootstrap workspace deps
        run: pnpm --filter @zcode/bootstrap... run build

      # ADR-15 D15.1/D15.7：ADR-15 交付后 prepare 脚本是唯一编译纪律（csc flag
      # 集与本 job 旧 ad-hoc 编译步逐字节同源 —— 打包产物就是被证明的产物）。
      # 本步断言 staged pair 的自洽（version/target/helper 形状 + digest 重验），
      # 并把 staged binary 路径 + manifest digest 落 **step outputs** —— 绝不写
      # GITHUB_ENV（round-1 CI 教训，恢复本 job 旧纪律：供给键 job 级泄漏会让
      # peer-verification 套件的 startBroker() 经 resolveDefaultPeerRelayHelper
      # 解析到 helper 而 boot peer_verified，§5.3 管道口门（D14.8 spawn 表）对
      # 未注册/无映像 pid 是**零字节弃连**（§5.3(1)/(4)，无拒绝行），该套件
      # audit-ingress 行的拒绝行断言只在 Linux 直读 / darwin relay / win32
      # degraded（broker 自持管道应答）三态可达 —— 泄漏即确定性超时）。供给声明
      # 只作用于下方 §5.3 平台套件步（D15.7：平台行对 prepare 脚本产物重跑 ——
      # path + manifest digest，D13.9 env 键纪律不变）。csc.exe 仍为 OS 内置
      # .NET Framework 编译器（windows-latest 必备路径；/warnaserror+ 对应
      # gates-macos 的 -Werror）；脚本同时把编译产物留在 native/…/out/（平台
      # 套件 fallback）。
      - name: Prepare the Windows peer-verification helper (packaging discipline)
        id: payswap-helper
        shell: pwsh
        run: |
          node apps/zcode-cli/packages/cli/scripts/prepare-payswap-broker-peer-helper.mjs --target win-x64
          $staged = "packages/desktop/bundled-tools/win32-x64/payswap-broker-peer"
          $manifest = Get-Content (Join-Path $staged "manifest.json") -Raw | ConvertFrom-Json
          if ($manifest.version -ne 1 -or $manifest.target -ne "win-x64" -or $null -eq $manifest.helper) {
            throw "unexpected staged payswap broker peer manifest: $(Get-Content (Join-Path $staged 'manifest.json') -Raw)"
          }
          $helperPath = (Resolve-Path (Join-Path $staged $manifest.helper.binaryName)).Path
          $actual = (Get-FileHash $helperPath -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $manifest.helper.sha256) {
            throw "staged helper digest mismatch: manifest $($manifest.helper.sha256), actual $actual"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "helperPath=$helperPath"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "helperSha256=$($manifest.helper.sha256)"
          Write-Host "staged helper: $helperPath sha256=$($manifest.helper.sha256)"

      # win32 **默认无 helper 态**的 fail-closed 行（degraded 自持管道照常应答拒绝
      # 行；"platform default" 行自带 save/delete/restore，对供给键在场均成立）。
      # 本步不设供给键 —— 默认态是本套件的被钉对象（供给激活态在下一步证明）。
      - name: Bootstrap payswap peer-verification suite (win32 default-state fail-closed rows)
        run: >
          pnpm --filter @zcode/bootstrap exec vitest run
          tests/payswap-broker-peer-verification.test.ts

      # §5.3 平台行（ADR-14 D14.10 / ADR-15 D15.7）：对 prepare 脚本的 staging 产物
      # 重跑 —— path + manifest digest 经 D13.9 供给键，**步级 env**（恰好一个套件
      # 消费；beforeAll 再验 env digest = 实际字节）。断言与旧 job 完全一致（打包
      # 产物就是被证明的产物）。
      - name: Bootstrap payswap windows platform suite (prepare-script output)
        run: >
          pnpm --filter @zcode/bootstrap exec vitest run
          tests/payswap-broker-peer-windows.test.ts
        env:
          PAYSWAP_BROKER_HELPER_PATH: ${{ steps.payswap-helper.outputs.helperPath }}
          PAYSWAP_BROKER_HELPER_SHA256: ${{ steps.payswap-helper.outputs.helperSha256 }}
